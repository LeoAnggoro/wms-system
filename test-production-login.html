<!DOCTYPE html>
<html>
<head>
    <title>Test Login Production</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .box {
            background: #16213e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 5px solid #4ecca3;
        }
        button {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #45b393;
        }
        .result {
            background: #0f3460;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }
        .success { color: #4ecca3; }
        .error { color: #e74a3b; }
        .warning { color: #ffc107; }
    </style>
</head>
<body>
    <h1>🧪 Test Login - Production API</h1>
    
    <div class="box">
        <h2>Test 1: Server Health</h2>
        <button onclick="testHealth()">Test Server</button>
        <div id="health-result"></div>
    </div>

    <div class="box">
        <h2>Test 2: Login dengan Credentials Salah</h2>
        <button onclick="testInvalidLogin()">Test Login Salah</button>
        <div id="invalid-result"></div>
    </div>

    <div class="box">
        <h2>Test 3: Login dengan Credentials Benar</h2>
        <input type="email" id="email" placeholder="Email dari database Supabase" />
        <input type="password" id="password" placeholder="Password yang benar" />
        <button onclick="testValidLogin()">Test Login</button>
        <div id="valid-result"></div>
    </div>

    <div class="box">
        <h2>Local Storage Status</h2>
        <button onclick="clearStorage()">Clear Storage</button>
        <div id="storage-status"></div>
    </div>

    <script>
        const API_URL = 'https://wms-system-production-6dbe.up.railway.app';

        function showResult(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.className = `result ${type}`;
            el.textContent = message;
        }

        function updateStorageStatus() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            const el = document.getElementById('storage-status');
            
            let html = '';
            if (token) {
                html += `<p class="success">✅ Token: ADA (${token.substring(0, 50)}...)</p>`;
            } else {
                html += `<p class="error">❌ Token: TIDAK ADA</p>`;
            }
            
            if (user) {
                html += `<p class="success">✅ User: ADA (${user.substring(0, 50)}...)</p>`;
            } else {
                html += `<p class="error">❌ User: TIDAK ADA</p>`;
            }
            
            el.innerHTML = html;
        }

        function clearStorage() {
            localStorage.clear();
            updateStorageStatus();
            alert('LocalStorage dibersihkan!');
        }

        async function testHealth() {
            showResult('health-result', '⏳ Testing...', 'warning');
            
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                if (res.ok) {
                    showResult('health-result', 
                        `✅ Server AKTIF!\n\n${JSON.stringify(data, null, 2)}`, 
                        'success');
                } else {
                    showResult('health-result', 
                        `⚠️ Server respon tapi status ${res.status}\n\n${JSON.stringify(data, null, 2)}`, 
                        'warning');
                }
            } catch (err) {
                showResult('health-result', 
                    `❌ Server TIDAK bisa diakses!\n\nError: ${err.message}`, 
                    'error');
            }
        }

        async function testInvalidLogin() {
            showResult('invalid-result', '⏳ Testing login dengan credentials salah...', 'warning');
            
            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'user_tidak_ada_12345@example.com',
                        password: 'password_salah'
                    })
                });
                
                const data = await res.json();
                
                let message = `Status: ${res.status}\n`;
                message += `Response: ${JSON.stringify(data, null, 2)}\n\n`;
                
                if (res.status === 401) {
                    message += '✅ BENAR! Server menolak dengan 401 (Unauthorized)';
                    showResult('invalid-result', message, 'success');
                } else if (res.status === 404) {
                    message += '❌ SALAH! Server return 404 - endpoint tidak ada!';
                    message += '\n\nArtinya: Railway BELUM deploy code terbaru';
                    showResult('invalid-result', message, 'error');
                } else if (res.status === 200) {
                    message += '❌ BAHAYA! Server terima credentials salah!';
                    showResult('invalid-result', message, 'error');
                } else {
                    message += `⚠️ Status tidak terduga: ${res.status}`;
                    showResult('invalid-result', message, 'warning');
                }
            } catch (err) {
                showResult('invalid-result', 
                    `❌ Error: ${err.message}`, 
                    'error');
            }
        }

        async function testValidLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Email dan password harus diisi!');
                return;
            }
            
            showResult('valid-result', '⏳ Testing login...', 'warning');
            
            // Clear storage dulu
            localStorage.clear();
            
            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                let message = `Status: ${res.status}\n`;
                message += `Response: ${JSON.stringify(data, null, 2)}\n\n`;
                
                if (res.status === 200 && data.token) {
                    // BERHASIL
                    localStorage.setItem('token', data.token);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    
                    message += '✅ LOGIN BERHASIL!';
                    message += `\nToken: ${data.token.substring(0, 50)}...`;
                    message += `\nUser: ${JSON.stringify(data.user)}`;
                    showResult('valid-result', message, 'success');
                    updateStorageStatus();
                } else if (res.status === 401) {
                    // GAGAL
                    message += '❌ Login gagal - Email atau password salah';
                    showResult('valid-result', message, 'error');
                } else if (res.status === 404) {
                    // ENDPOINT TIDAK ADA
                    message += '❌ Endpoint TIDAK ADA (404)';
                    message += '\n\nRailway belum deploy code terbaru!';
                    showResult('valid-result', message, 'error');
                } else {
                    message += `⚠️ Response tidak terduga: ${res.status}`;
                    showResult('valid-result', message, 'warning');
                }
            } catch (err) {
                showResult('valid-result', 
                    `❌ Error: ${err.message}`, 
                    'error');
            }
        }

        // Update storage status on load
        updateStorageStatus();
    </script>
</body>
</html>
