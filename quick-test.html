<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test - WMS API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            color: #4ecca3;
            border-bottom: 3px solid #4ecca3;
            padding-bottom: 10px;
        }
        .test-box {
            background: #0f3460;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #4ecca3;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
        }
        .success {
            background: #1e7e34;
            border: 2px solid #28a745;
        }
        .error {
            background: #7e1e1e;
            border: 2px solid #dc3545;
        }
        .pending {
            background: #856404;
            border: 2px solid #ffc107;
        }
        button {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #45b393;
        }
        pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #4ecca3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Quick Test - WMS Production API</h1>
        
        <div class="test-box">
            <h2>🔍 Test 1: Server Health Check</h2>
            <button onclick="testServerHealth()">Test Server</button>
            <div id="health-result"></div>
        </div>

        <div class="test-box">
            <h2>🔍 Test 2: Login Endpoint</h2>
            <button onclick="testLoginEndpoint()">Test Login Endpoint</button>
            <div id="login-result"></div>
        </div>

        <div class="test-box">
            <h2>🔍 Test 3: Login dengan Credentials</h2>
            <div style="margin: 15px 0;">
                <label>Email:</label>
                <input type="email" id="test-email" placeholder="Email dari database" style="width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none;" />
                
                <label>Password:</label>
                <input type="password" id="test-password" placeholder="Password yang benar" style="width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none;" />
                
                <button onclick="testLoginWithCredentials()" style="margin-top: 10px;">Test Login</button>
            </div>
            <div id="credentials-result"></div>
        </div>

        <div class="test-box">
            <h2>📊 Summary</h2>
            <div id="summary"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://wms-system-production-6dbe.up.railway.app';
        let testResults = {
            server: null,
            loginEndpoint: null,
            loginAuth: null
        };

        function updateSummary() {
            const summary = document.getElementById('summary');
            let html = '<h3>Test Results:</h3><ul>';
            
            html += `<li>Server Health: ${testResults.server === true ? '✅ PASS' : testResults.server === false ? '❌ FAIL' : '⏳ PENDING'}</li>`;
            html += `<li>Login Endpoint: ${testResults.loginEndpoint === true ? '✅ PASS (405 = route ada)' : testResults.loginEndpoint === false ? '❌ FAIL (404 = route tidak ada)' : '⏳ PENDING'}</li>`;
            html += `<li>Login Auth: ${testResults.loginAuth === true ? '✅ PASS' : testResults.loginAuth === false ? '❌ FAIL' : '⏳ PENDING'}</li>`;
            
            html += '</ul>';
            
            if (testResults.server === true && testResults.loginEndpoint === true) {
                html += '<p style="color: #4ecca3; font-size: 18px; font-weight: bold;">✅ Server dan route sudah benar! Silakan test login dengan credentials valid.</p>';
            } else if (testResults.loginEndpoint === false) {
                html += '<p style="color: #dc3545; font-size: 18px; font-weight: bold;">❌ Route /api/auth/login TIDAK ADA (404). Railway deployment belum berhasil.</p>';
            }
            
            summary.innerHTML = html;
        }

        async function testServerHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '<div class="status pending">⏳ Testing...</div>';
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (response.ok) {
                    testResults.server = true;
                    resultDiv.innerHTML = `
                        <div class="status success">
                            ✅ SERVER AKTIF<br>
                            Status: ${response.status}<br>
                            Message: ${data.message}<br>
                            DB Status: ${data.db_status}<br>
                            Timestamp: ${data.timestamp}
                        </div>
                    `;
                } else {
                    testResults.server = false;
                    resultDiv.innerHTML = `<div class="status error">❌ Server error: ${response.status}</div>`;
                }
            } catch (err) {
                testResults.server = false;
                resultDiv.innerHTML = `<div class="status error">❌ Server tidak dapat diakses: ${err.message}</div>`;
            }
            
            updateSummary();
        }

        async function testLoginEndpoint() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = '<div class="status pending">⏳ Testing endpoint...</div>';
            
            try {
                // Test dengan GET request (seharusnya 405 Method Not Allowed jika route ada)
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'GET'
                });
                
                if (response.status === 405) {
                    // 405 = Method Not Allowed (route ada, tapi GET tidak diperbolehkan)
                    testResults.loginEndpoint = true;
                    resultDiv.innerHTML = `
                        <div class="status success">
                            ✅ ENDPOINT ADA!<br>
                            Status: ${response.status} (Method Not Allowed)<br>
                            <strong>Artinya:</strong> Route /api/auth/login sudah terdaftar di server<br>
                            <strong>Method yang benar:</strong> POST (bukan GET)
                        </div>
                    `;
                } else if (response.status === 404) {
                    // 404 = Not Found (route tidak ada)
                    testResults.loginEndpoint = false;
                    resultDiv.innerHTML = `
                        <div class="status error">
                            ❌ ENDPOINT TIDAK ADA!<br>
                            Status: ${response.status} (Not Found)<br>
                            <strong>Artinya:</strong> Route /api/auth/login BELUM terdaftar di server<br>
                            <strong>Penyebab:</strong> Railway belum deploy code terbaru<br>
                            <strong>Solusi:</strong> Redeploy Railway dengan root directory = "backend"
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="status error">⚠️ Status tidak terduga: ${response.status}</div>`;
                }
            } catch (err) {
                testResults.loginEndpoint = false;
                resultDiv.innerHTML = `<div class="status error">❌ Error: ${err.message}</div>`;
            }
            
            updateSummary();
        }

        async function testLoginWithCredentials() {
            const resultDiv = document.getElementById('credentials-result');
            const email = document.getElementById('test-email').value.trim();
            const password = document.getElementById('test-password').value;
            
            if (!email || !password) {
                resultDiv.innerHTML = '<div class="status error">❌ Email dan password harus diisi!</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="status pending">⏳ Testing login...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.status === 200 && data.token) {
                    // LOGIN BERHASIL
                    testResults.loginAuth = true;
                    resultDiv.innerHTML = `
                        <div class="status success">
                            ✅ LOGIN BERHASIL!<br>
                            Status: ${response.status}<br>
                            Token: ${data.token.substring(0, 50)}...<br>
                            User: ${JSON.stringify(data.user)}<br>
                            <strong>Artinya:</strong> Backend sudah benar, user bisa login!
                        </div>
                    `;
                } else if (response.status === 401) {
                    // AUTH FAILED
                    testResults.loginAuth = false;
                    resultDiv.innerHTML = `
                        <div class="status error">
                            ❌ LOGIN GAGAL (401 Unauthorized)<br>
                            Error: ${data.error}<br>
                            <strong>Artinya:</strong> Email atau password salah, ATAU user tidak ada di database
                        </div>
                    `;
                } else if (response.status === 400) {
                    // VALIDATION FAILED
                    testResults.loginAuth = false;
                    resultDiv.innerHTML = `
                        <div class="status error">
                            ❌ VALIDASI GAGAL (400 Bad Request)<br>
                            Error: ${data.error}<br>
                            <strong>Artinya:</strong> Input tidak valid
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            ⚠️ Response tidak terduga<br>
                            Status: ${response.status}<br>
                            Data: ${JSON.stringify(data)}
                        </div>
                    `;
                }
            } catch (err) {
                testResults.loginAuth = false;
                resultDiv.innerHTML = `<div class="status error">❌ Error: ${err.message}</div>`;
            }
            
            updateSummary();
        }

        // Auto-run on load
        window.onload = function() {
            updateSummary();
        };
    </script>
</body>
</html>
